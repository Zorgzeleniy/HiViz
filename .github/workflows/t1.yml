name: t1

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: ruff (pyflakes + bugbear; config in ruff.toml)
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.10
          ruff check .

  min-python:
    # README promises Python >= 3.11 (tomllib): older interpreters must fail with a clear message, not a traceback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: engines refuse Python 3.10 with a clear message
        run: |
          for engine in drift/check.py constitution/run.py; do
            out=$(python "$engine" 2>&1 || true)
            echo "$out"
            echo "$out" | grep -q "needs Python >= 3.11"
          done

  harness-discovery:
    # The real harness CLIs must still see what `hiviz init` installs. No model, no credentials, no network calls to a provider.
    # Versions are pinned: a CLI release that changes its skill discovery should fail HERE, once, on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2" # omp needs bun >= 1.3.14
      - name: install the harness CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.292 @openai/codex@0.160.1 @mariozechner/pi-coding-agent@0.73.1 opencode-ai@1.18.34
          bun install -g @oh-my-pi/pi-coding-agent@18.7.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: T1 with every discoverable harness required
        env:
          HIVIZ_REQUIRE_HARNESSES: claude,codex,pi,opencode,omp
        run: python tests/run.py --t1

  t1:
    name: t1 (${{ matrix.os }}, py${{ matrix.python }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.13"]
        node: ["22"]
        include:
          - { os: ubuntu-24.04, python: "3.13", node: "16" } # README: Node >= 16
          - { os: macos-latest, python: "3.13", node: "22" }
          - { os: windows-latest, python: "3.13", node: "22" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # windows runners default to pwsh; the T1 step is bash (tee/pipefail/grep)
    # macOS and Windows went green on 2026-10-15 (run 38991288192) — they block like ubuntu now.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: node syntax + T-key parity
        run: |
          node --check bin/hiviz.js
          python tests/parity.py
      - name: marketplace plugin is current (plugin/ + catalogs rendered from core/, templates/, engines)
        run: node scripts/build-plugin.js --check
      - name: deterministic test rig (T1)
        run: |
          rc=0
          python tests/run.py --t1 2>&1 | tee t1-run.log || rc=$?
          echo "::error::diag rc=$rc logsize=$(wc -c < t1-run.log)"
          grep -E "\[FAIL\]" t1-run.log | sed 's/^/::error::/' || true
          tail -12 t1-run.log | sed 's/^/::error::/' || true
          grep -B2 -A10 "Traceback" t1-run.log | head -30 | sed 's/^/::error::/' || true
          exit $rc
      - name: t1 log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: t1-run.log
