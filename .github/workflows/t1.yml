name: t1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  t1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: node syntax + T-key parity
        run: |
          node --check bin/hiviz.js
          python tests/parity.py
      - name: deterministic test rig (T1)
        run: python tests/run.py --t1
