name: "hiviz drift check"
description: "Deterministic CI gate for standing agent instructions: facts-vs-environment drift + MCP pay-vs-use. No LLM, no API keys."
branding:
  icon: "check-circle"
  color: "orange"
inputs:
  active-checks:
    description: "Run `shell` / `port_open` facts: auto (default) | on | off. auto skips them for fork pull requests and pull_request_target, where facts.toml comes from the PR."
    default: "auto"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: drift check
      shell: bash
      # engines run straight from the action checkout — pinned to the ref the workflow uses, no npm
      env:
        HIVIZ_ENGINES: ${{ github.action_path }}
        HIVIZ_ACTIVE_CHECKS: ${{ inputs.active-checks }}
      run: |
        if [ ! -f .hiviz/facts.toml ]; then
          echo "no .hiviz/facts.toml — run /hv-audit (or ask hiviz to ingest your facts) and commit it. Skipping."
          exit 0
        fi
        python "$HIVIZ_ENGINES/drift/check.py" --facts .hiviz/facts.toml --base .
