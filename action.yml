name: "hiviz drift check"
description: "Deterministic CI gate for standing agent instructions: facts-vs-environment drift + MCP pay-vs-use. No LLM, no API keys."
branding:
  icon: "check-circle"
  color: "orange"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: install hiviz engines
      shell: bash
      run: npx -y hiviz@latest init
    - name: drift check
      shell: bash
      run: |
        if [ ! -f .hiviz/facts.toml ]; then
          echo "no .hiviz/facts.toml — run /hv-audit (or ask hiviz to ingest your facts) and commit it. Skipping."
          exit 0
        fi
        python ~/.hiviz/engines/drift/check.py --facts .hiviz/facts.toml --base .
