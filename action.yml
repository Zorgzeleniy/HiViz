name: "hiviz drift check"
description: "Deterministic CI gate for standing agent instructions: facts-vs-environment drift + MCP pay-vs-use. No LLM, no API keys."
branding:
  icon: "check-circle"
  color: "orange"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: drift check
      shell: bash
      run: |
        if [ ! -f .hiviz/facts.toml ]; then
          echo "no .hiviz/facts.toml — run /hv-audit (or ask hiviz to ingest your facts) and commit it. Skipping."
          exit 0
        fi
        # engines ship inside the action checkout — no npm, no network
        python "${{ github.action_path }}/drift/check.py" --facts .hiviz/facts.toml --base .
